<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste v3 — por que o Senado devolve vazio?</title>
<style>
  :root{--ok:#1a7f37;--bad:#b3261e;--warn:#8a6d00;--line:#d8d8d8;--mut:#666;}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:800px;margin:0 auto;padding:20px 14px 60px;color:#1a1a1a;line-height:1.5}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 16px}
  button{font:inherit;font-weight:600;padding:10px 20px;border:1px solid #1a1a1a;background:#1a1a1a;color:#fff;border-radius:6px;cursor:pointer}
  button:disabled{opacity:.5}
  .r{border-bottom:1px solid var(--line);padding:11px 0}
  .hd{display:flex;gap:9px;align-items:baseline}
  .st{font-size:17px;width:20px;flex:none}
  .nm{font-weight:600;font-size:13.5px;flex:1}
  .ep{font-family:ui-monospace,monospace;font-size:10px;color:var(--mut);word-break:break-all;margin:3px 0 0 29px}
  .ms{font-size:13px;font-weight:600;margin:5px 0 0 29px}
  .ms.ok{color:var(--ok)}.ms.bad{color:var(--bad)}.ms.warn{color:var(--warn)}
  .peek{font-family:ui-monospace,monospace;font-size:10px;background:#f4f4f4;padding:6px 8px;border-radius:4px;margin:5px 0 0 29px;word-break:break-all;color:#333;max-height:90px;overflow:auto}
  #v{margin-top:20px;padding:15px;border:2px solid var(--line);border-radius:8px;display:none;font-size:14px}
  #v h2{font-size:15px;margin:0 0 8px}
  .top{border-top:1px solid var(--line);margin-top:18px}
  code{background:#f2f2f2;padding:1px 5px;border-radius:3px;font-size:12px}
</style>
</head>
<body>

<h1>Teste v3 — por que o Senado devolve vazio?</h1>
<p class="sub">CORS já está confirmado como liberado. Agora o alvo é outro: descobrir qual variação de endereço
faz a API do Senado entregar os dados de verdade a partir do navegador.</p>

<button id="go">Rodar teste</button>

<div class="top" id="rows"></div>
<div id="v"></div>

<script>
var T=[
 {n:"CONTROLE — lista de senadores (endpoint antigo e simples)",
  u:"https://legis.senado.leg.br/dadosabertos/senador/lista/atual.json", h:null,
  o:"Se este vier cheio, a API funciona no navegador e o problema é só do /processo."},

 {n:"Lista de PLN — sem cabeçalho nenhum",
  u:"https://legis.senado.leg.br/dadosabertos/processo?sigla=PLN&ano=2026", h:null,
  o:"Igual ao que eu faço do meu lado."},

 {n:"Lista de PLN — com parâmetro de versão v=1",
  u:"https://legis.senado.leg.br/dadosabertos/processo?sigla=PLN&ano=2026&v=1", h:{Accept:"application/json"},
  o:"Algumas rotas do Senado exigem versão explícita."},

 {n:"Lista de PLN — pelo domínio .gov.br",
  u:"https://legis.senado.gov.br/dadosabertos/processo?sigla=PLN&ano=2026", h:{Accept:"application/json"},
  o:"O domínio .gov.br pode cair em outro servidor."},

 {n:"Busca MPV 1362/2026 por número",
  u:"https://legis.senado.leg.br/dadosabertos/processo?sigla=MPV&numero=1362&ano=2026", h:{Accept:"application/json"},
  o:"Busca específica — do meu lado devolve 1 resultado."},

 {n:"Tramitação por id — domínio .gov.br",
  u:"https://legis.senado.gov.br/dadosabertos/processo/9053447", h:{Accept:"application/json"},
  o:"Mesmo id que deu 404 no outro domínio."},

 {n:"Tramitação — endpoint de detalhe alternativo",
  u:"https://legis.senado.leg.br/dadosabertos/processo/9053447/detalhes", h:{Accept:"application/json"},
  o:"Testando outro caminho de detalhe."}
];

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}

document.getElementById('go').addEventListener('click',function(){
  var b=this;b.disabled=true;b.textContent="Testando...";
  var box=document.getElementById('rows');box.innerHTML='';
  var vv=document.getElementById('v');vv.style.display='none';
  var res=[],pend=T.length;

  T.forEach(function(t,i){
    var r=el('div','r'),hd=el('div','hd');
    var st=el('div','st','⏳');hd.appendChild(st);
    hd.appendChild(el('div','nm',t.n));
    r.appendChild(hd);
    r.appendChild(el('div','ep',t.u));
    var ms=el('div','ms warn','testando...');r.appendChild(ms);
    r.appendChild(el('div','ep',t.o));
    box.appendChild(r);

    var c=new AbortController(),to=setTimeout(function(){c.abort();},20000);
    var op={signal:c.signal};if(t.h)op.headers=t.h;

    fetch(t.u,op).then(function(x){clearTimeout(to);
      return x.text().then(function(b){return {s:x.status,ok:x.ok,b:b};});
    }).then(function(o){
      var head=(o.b||'').trim();
      var n=null;
      try{var d=JSON.parse(head);
        if(Array.isArray(d)) n=d.length;
        else if(d&&typeof d==='object'){
          if(d.identificacao) n='objeto: '+d.identificacao;
          else { var k=Object.keys(d); n='objeto com chaves: '+k.slice(0,4).join(', '); }
        }
      }catch(e){ n=null; }

      if(n!==null && n!==0 && o.ok){
        st.textContent='✅';ms.className='ms ok';
        ms.textContent='DADOS RECEBIDOS — '+(typeof n==='number'? n+' itens' : n);
        res[i]={ok:true};
      } else if(o.ok && n===0){
        st.textContent='⚠️';ms.className='ms warn';
        ms.textContent='RESPONDEU VAZIO — status 200, array com 0 itens';
        res[i]={ok:false,vazio:true};
      } else {
        st.textContent='⚠️';ms.className='ms warn';
        ms.textContent='status HTTP '+o.s+(o.ok?'':' — sem dados');
        res[i]={ok:false};
      }
      r.appendChild(el('div','peek','RESPOSTA: '+head.slice(0,400)+(head.length>400?'...':'')));
    }).catch(function(e){
      clearTimeout(to);
      st.textContent='❌';ms.className='ms bad';
      ms.textContent=(e.name==='AbortError')?'sem resposta em 20s':'BLOQUEADO POR CORS — '+e.message;
      res[i]={ok:false,cors:true};
    }).then(function(){ if(--pend===0){
      var bons=res.filter(function(x){return x&&x.ok;}).length;
      var vv=document.getElementById('v');vv.style.display='block';
      vv.innerHTML='<h2>Resultado</h2><p><b>'+bons+' de '+T.length+' variações trouxeram dados.</b></p>'
        +(res[0]&&res[0].ok
          ? '<p>O controle (lista de senadores) funcionou — então a API do Senado <b>serve dados ao navegador</b>. O problema está restrito à rota <code>/processo</code>, e a variação que funcionou acima é o caminho a usar.</p>'
          : '<p>O controle também falhou — então não é a rota <code>/processo</code>, é a API do Senado inteira se comportando diferente com o navegador. Nesse caso o bloco 3 precisa de um programa.</p>')
        +'<p style="margin-bottom:0">Mande a tela inteira de volta, inclusive os quadros cinza com as respostas.</p>';
      var b=document.getElementById('go');b.disabled=false;b.textContent='Rodar de novo';
    }});
  });
});
</script>
</body>
</html>
